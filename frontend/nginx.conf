server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        # if_not_empty: um X-Forwarded-* vazio faria o Laravel (proxy confiavel)
        # ler host/proto vazios e quebrar em chamadas diretas e no healthcheck.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    location /storage/ {
        alias /var/www/storage/app/public/;
        autoindex off;
        access_log off;
        expires 7d;
    }

    location ~ ^/v/[A-Za-z0-9-]+/?$ {
        try_files /verificar.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
