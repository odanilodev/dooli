$kind: collection
description: "Collection completa da API de cursos (Laravel 13 + Sanctum). Rode 'Setup (rode primeiro)' para autenticar. Todas as requisições enviam Accept: application/json. Variáveis são preenchidas automaticamente pelos testes das requisições."
variables:
  base_url: http://localhost:8000
  company_id: "1"
  admin_email: admin@cursos.test
  admin_password: password
  student_email: aluno@cursos.test
  student_password: password
  admin_token: ""
  student_token: ""
  course_id: "1"
  module_id: "1"
  topic_id: "1"
  lesson_id: "1"
  team_id: "1"
  user_id: "2"
  user_type_id: "1"
  coupon_id: "1"
  coupon_code: BEMVINDO10
  store_product_id: "1"
  store_product_slug: curso-de-php
  gateway_id: "1"
  gateway_code: manual
  webhook_secret: dev-manual-secret
  certificate_id: "1"
  certificate_user_id: "1"
  certificate_code: DEMO-CERT-0001
  order_id: "1"
  payment_id: "1"
  notification_id: "1"
  comment_id: "1"
  rating_id: "1"
  video_id: "1"
  document_id: "1"
  attachment_id: "1"
  banner_id: "1"
  reset_token: ""
scripts:
  - type: http:beforeRequest
    code: "pm.request.headers.upsert({ key: 'Accept', value: 'application/json' });"
    language: text/javascript
auth:
  - id: b1eeac97-7407-4aba-b7da-883466470f48
    type: bearer
    name: bearer auth
    credentials:
      token: "{{admin_token}}"
