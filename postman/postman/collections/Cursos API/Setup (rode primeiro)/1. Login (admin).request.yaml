$kind: http-request
description: Autentica como administrador e preenche {{admin_token}}.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "{{admin_email}}",
        "password": "{{admin_password}}",
        "device_name": "postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.token) { pm.collectionVariables.set('admin_token', j.data.token); }
      if (j && j.data && j.data.user && j.data.user.company_id) { pm.collectionVariables.set('company_id', j.data.user.company_id); }
      pm.test('login ok', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
