$kind: http-request
description: Autentica como aluno e preenche {{student_token}}.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "{{student_email}}",
        "password": "{{student_password}}",
        "device_name": "postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.token) { pm.collectionVariables.set('student_token', j.data.token); }
      pm.test('login ok', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
