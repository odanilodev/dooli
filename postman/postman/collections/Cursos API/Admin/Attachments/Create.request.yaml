$kind: http-request
url: "{{base_url}}/api/v1/admin/attachments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "path": "attachments/teste.zip",
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.id) { pm.collectionVariables.set('attachment_id', j.data.id); }
    language: text/javascript
order: 2000
