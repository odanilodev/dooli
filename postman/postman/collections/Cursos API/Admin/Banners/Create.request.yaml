$kind: http-request
url: "{{base_url}}/api/v1/admin/banners"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Banner de Teste",
        "path": "banners/teste.jpg",
        "link": "/store",
        "sort_order": 0,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.id) { pm.collectionVariables.set('banner_id', j.data.id); }
    language: text/javascript
order: 2000
