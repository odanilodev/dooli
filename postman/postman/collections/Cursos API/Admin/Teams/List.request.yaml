$kind: http-request
url: "{{base_url}}/api/v1/admin/teams"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && Array.isArray(j.data) && j.data.length && j.data[0].id) { pm.collectionVariables.set('team_id', j.data[0].id); }
    language: text/javascript
order: 1000
