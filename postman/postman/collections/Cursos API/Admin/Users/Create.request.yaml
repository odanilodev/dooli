$kind: http-request
url: "{{base_url}}/api/v1/admin/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Usuário de Teste",
        "username": "usuario_teste",
        "email": "usuario.teste@cursos.test",
        "password": "password",
        "user_type_id": {{user_type_id}},
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.id) { pm.collectionVariables.set('user_id', j.data.id); }
    language: text/javascript
order: 2000
