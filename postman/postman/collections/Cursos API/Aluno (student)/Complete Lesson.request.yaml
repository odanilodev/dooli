$kind: http-request
url: "{{base_url}}/api/v1/me/progress/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "lesson_id": {{lesson_id}},
        "course_id": {{course_id}},
        "team_id": {{team_id}},
        "module_id": {{module_id}}
    }
auth:
  type: bearer
  credentials:
    token: "{{student_token}}"
order: 5000
