$kind: http-request
url: "{{base_url}}/api/v1/comments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "content": "Ótima aula!",
        "lesson_id": {{lesson_id}},
        "module_id": {{module_id}},
        "course_id": {{course_id}},
        "team_id": {{team_id}}
    }
auth:
  type: bearer
  credentials:
    token: "{{student_token}}"
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j && j.data && j.data.id) { pm.collectionVariables.set('comment_id', j.data.id); }
    language: text/javascript
order: 16000
