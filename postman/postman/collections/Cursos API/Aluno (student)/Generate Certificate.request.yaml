$kind: http-request
url: "{{base_url}}/api/v1/me/certificates/generate"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "course_id": {{course_id}},
        "team_id": {{team_id}}
    }
auth:
  type: bearer
  credentials:
    token: "{{student_token}}"
order: 7000
