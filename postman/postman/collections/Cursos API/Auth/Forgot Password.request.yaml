$kind: http-request
description: Sempre retorna 200 (sem enumeração). O token chega por e-mail.
url: "{{base_url}}/api/v1/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "{{student_email}}"
    }
auth:
  type: noauth
order: 4000
