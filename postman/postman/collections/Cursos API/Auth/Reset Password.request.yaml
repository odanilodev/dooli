$kind: http-request
url: "{{base_url}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "token": "{{reset_token}}",
        "email": "{{student_email}}",
        "password": "new-password-123",
        "password_confirmation": "new-password-123"
    }
auth:
  type: noauth
order: 5000
