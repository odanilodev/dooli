openapi: 3.0.3
info:
  title: Cursos API
  description: API REST da plataforma de cursos (Laravel 13 + Sanctum, multi-tenant).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local
tags:
  - name: Auth
  - name: Store
  - name: Student
  - name: Admin
  - name: Webhooks

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Autentica e retorna um token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                username: { type: string }
                password: { type: string, minLength: 6 }
                device_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Cria uma conta de aluno e envia o código de confirmação
      description: A conta não é autenticada até a confirmação do código de 6 dígitos.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompany'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, terms]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string, minLength: 8 }
                terms: { type: boolean }
                device_name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Conta criada com confirmação de e-mail pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { description: Empresa não informada }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/public/tenant/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirma o código de e-mail e autentica o aluno
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200': { description: E-mail confirmado e token emitido }
        '422': { description: Código inválido, expirado ou tentativas esgotadas }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/public/tenant/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Reenvia o código de confirmação de e-mail
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Resposta genérica; o código só é reenviado se necessário }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: UsuÃ¡rio autenticado
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessÃ£o atual
      responses:
        '200': { description: OK }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Envia o link de redefiniÃ§Ã£o de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: 'Sempre 200 (nÃ£o revela se o e-mail existe)' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Redefine a senha com um token vÃ¡lido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK }
        '422': { description: Token invÃ¡lido }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me/profile:
    get:
      tags: [Auth]
      summary: Perfil do usuÃ¡rio autenticado
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      summary: Atualiza o prÃ³prio perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                username: { type: string }
                email: { type: string, format: email }
                image: { type: string }
                phone: { type: string }
                address: { type: string }
                city: { type: string }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/me/password:
    put:
      tags: [Auth]
      summary: Troca a prÃ³pria senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/store/products:
    get:
      tags: [Store]
      summary: Lista produtos de loja ativos
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { description: OK }
        '400': { description: Empresa nÃ£o informada }

  /api/v1/store/products/{slug}:
    get:
      tags: [Store]
      summary: Detalhe do produto de loja
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/banners:
    get:
      tags: [Store]
      summary: Banners ativos da home (hero, placement=home)
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
      responses:
        '200': { description: OK }
        '400': { description: Empresa nÃ£o informada }

  /api/v1/storefront:
    get:
      tags: [Store]
      summary: Contexto, textos e banners da loja interna
      description: Inclui company.id, name, slug, public_store_url e gateways ativos, alem de settings e banners.
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
      responses:
        '200': { description: OK }
        '400': { description: Empresa nǜo informada }

  /api/v1/certificates/{code}/verify:
    get:
      tags: [Store]
      summary: Verifica autenticidade do certificado
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
        - name: code
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      code: { type: string, format: uuid }
                      valid: { type: boolean }
                      holder_name: { type: string }
                      course: { type: string, nullable: true }
                      lessons_count: { type: integer }
                      issued_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/certificates/{code}:
    get:
      tags: [Store]
      summary: Payload da pÃ¡gina pÃºblica do certificado
      description: NÃ£o exige X-Company nem autenticaÃ§Ã£o; o cÃ³digo pÃºblico curto resolve o certificado. UUIDs antigos tambÃ©m sÃ£o aceitos. Certificados substituÃ­dos automaticamente retornam redirect_url para o vÃ¡lido atual.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9-]+$' }
      responses:
        '200':
          description: OK
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      code: { type: string, example: A7K2M9QX }
                      redirect_url: { type: string, format: uri, description: Presente quando o certificado foi substituÃ­do; aponta para o certificado vÃ¡lido atual. }
                      valid: { type: boolean, example: true }
                      holder_name: { type: string }
                      course: { type: string, nullable: true }
                      lessons_count: { type: integer }
                      issued_at: { type: string, format: date-time }
                      modules: { type: array, items: { type: object } }
                      certificate: { type: object }
                      share_url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/courses:
    get:
      tags: [Student]
      summary: Cursos do aluno
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/courses/{course}:
    get:
      tags: [Student]
      summary: ConteÃºdo do curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/courses/{course}/progress:
    get:
      tags: [Student]
      summary: Progresso do aluno no curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
        - name: team_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/progress/complete:
    post:
      tags: [Student]
      summary: Conclui uma aula (idempotente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_id, course_id, team_id, module_id]
              properties:
                lesson_id: { type: integer }
                course_id: { type: integer }
                team_id: { type: integer }
                module_id: { type: integer }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/me/certificates:
    get:
      tags: [Student]
      summary: Certificados do aluno
      responses:
        '200': { description: OK }

  /api/v1/me/certificates/generate:
    post:
      tags: [Student]
      summary: Gera certificado (validado no backend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, team_id]
              properties:
                course_id: { type: integer }
                team_id: { type: integer }
      responses:
        '201': { description: Emitido }
        '422': { description: CritÃ©rios nÃ£o atendidos }

  /api/v1/me/orders:
    get:
      tags: [Student]
      summary: Pedidos do aluno
      responses:
        '200': { description: OK }
    post:
      tags: [Student]
      summary: Cria pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      store_product_id: { type: integer }
                      quantity: { type: integer, minimum: 1 }
                coupon_code: { type: string }
      responses:
        '201': { description: Criado }
        '422': { description: Cupom invÃ¡lido }

  /api/v1/admin/storefront:
    get:
      tags: [Admin]
      summary: Textos configurados da loja
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Atualiza textos da loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalog:
                  type: object
                  properties:
                    eyebrow: { type: string, maxLength: 80 }
                    title: { type: string, maxLength: 120 }
                    description: { type: string, maxLength: 500 }
                benefits:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      title: { type: string, maxLength: 80 }
                      description: { type: string, maxLength: 160 }
                internal:
                  type: object
                  properties:
                    eyebrow: { type: string, maxLength: 80 }
                    title: { type: string, maxLength: 120 }
                    description: { type: string, maxLength: 500 }
                footer:
                  type: object
                  properties:
                    note: { type: string, maxLength: 255 }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Dados invǭlidos }

  /api/v1/admin/courses:
    get:
      tags: [Admin]
      summary: Lista cursos
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Cria curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                image: { type: string }
                status: { type: string, enum: [active, inactive] }
                sort_order: { type: integer }
      responses:
        '201': { description: Criado }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/courses/{course}:
    get:
      tags: [Admin]
      summary: Detalhe do curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Atualiza curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Admin]
      summary: Exclui curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
      responses:
        '204': { description: Sem conteÃºdo }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/courses/{course}/publish:
    post:
      tags: [Admin]
      summary: Publica curso
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
      responses:
        '200': { description: OK }

  /api/v1/admin/teams/{team}/students:
    post:
      tags: [Admin]
      summary: Adiciona aluno Ã  turma
      parameters:
        - name: team
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                expired_at: { type: string, format: date-time }
      responses:
        '200': { description: OK }

  /api/v1/admin/orders:
    get:
      tags: [Admin]
      summary: Lista pedidos da empresa
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/orders/{order}:
    get:
      tags: [Admin]
      summary: Detalhe do pedido
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/certificates/{certificate}/transfer-issued:
    post:
      tags: [Admin]
      summary: Transfere certificados vÃ¡lidos para outro modelo do mesmo curso
      parameters:
        - name: certificate
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_certificate_id]
              properties:
                target_certificate_id: { type: integer }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Regra de negÃ³cio }

  /api/v1/admin/certificate-users:
    get:
      tags: [Admin]
      summary: Lista certificados emitidos
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/certificate-users/{certificateUser}/revoke:
    post:
      tags: [Admin]
      summary: Invalida um certificado emitido
      parameters:
        - name: certificateUser
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/comments:
    get:
      tags: [Admin]
      summary: Lista comentÃ¡rios (moderaÃ§Ã£o)
      parameters:
        - name: roots_only
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { type: string, enum: [awaiting, answered] }
        - name: course_id
          in: query
          schema: { type: integer }
        - name: lesson_id
          in: query
          schema: { type: integer }
        - name: user_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/v1/admin/comments/bulk:
    delete:
      tags: [Admin]
      summary: Exclui comentÃ¡rios em lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 100
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: ComentÃ¡rio nÃ£o encontrado }
        '422': { description: ValidaÃ§Ã£o }

  /api/v1/admin/comments/{comment}:
    delete:
      tags: [Admin]
      summary: Exclui um comentÃ¡rio
      parameters:
        - name: comment
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Sem conteÃºdo }

  /api/v1/admin/ratings:
    get:
      tags: [Admin]
      summary: Lista avaliaÃ§Ãµes (moderaÃ§Ã£o)
      responses:
        '200': { description: OK }

  /api/v1/admin/ratings/{rating}:
    delete:
      tags: [Admin]
      summary: Exclui uma avaliaÃ§Ã£o
      parameters:
        - name: rating
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/v1/admin/datalogs:
    get:
      tags: [Admin]
      summary: Trilha de auditoria
      parameters:
        - name: module
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/v1/webhooks/payments/{gateway}:
    post:
      tags: [Webhooks]
      summary: Webhook de pagamento
      security: []
      parameters:
        - { $ref: '#/components/parameters/XCompany' }
        - name: gateway
          in: path
          required: true
          schema: { type: string, example: manual }
      responses:
        '202': { description: Enfileirado }
        '400': { description: Empresa nÃ£o informada }
        '401': { description: Assinatura invÃ¡lida }

  /api/v1/public/tenant:
    get:
      tags: [Store]
      summary: Dados publicos da empresa resolvida pelo dominio
      description: Inclui empresa, branding, storefront, banners e gateways ativos.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      responses:
        '200': { description: OK }
        '404': { description: Empresa inexistente ou inativa }
  /api/v1/public/tenant/store/products:
    get:
      tags: [Store]
      summary: Catalogo publico da empresa resolvida pelo dominio
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      responses:
        '200': { description: OK }
        '404': { description: Empresa inexistente ou inativa }
  /api/v1/public/tenant/store/products/{productSlug}:
    get:
      tags: [Store]
      summary: Detalhe publico de um produto pelo dominio
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
        - { name: productSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Produto ou empresa nao encontrado }
  /api/v1/public/tenant/auth/login:
    post:
      tags: [Auth]
      summary: Login restrito a empresa resolvida pelo dominio
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      responses:
        '200': { description: Autenticado }
        '401': { description: Credenciais invalidas }
        '404': { description: Empresa inexistente ou inativa }
  /api/v1/public/tenant/auth/register:
    post:
      tags: [Auth]
      summary: Cadastro de aluno na empresa resolvida pelo dominio
      description: O aluno só é autenticado após confirmar o código enviado por e-mail.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      responses:
        '201': { description: Aluno criado com confirmação de e-mail pendente }
        '404': { description: Empresa inexistente ou inativa }
  /api/v1/public/tenant/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Envia link de redefinicao pela empresa do dominio
      security: []
      parameters:
        - $ref: '#/components/parameters/XCompanyDomain'
      responses:
        '200': { description: Solicitacao aceita }
  /api/v1/public/tenant/auth/reset-password:
    post:
      tags: [Auth]
      summary: Redefine a senha na empresa do dominio
