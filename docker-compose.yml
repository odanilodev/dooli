name: cursos-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: cursos-api-app
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - bootstrap_cache:/var/www/html/bootstrap/cache
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  app:
    <<: *app-base
    container_name: cursos_api_app
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    command: php artisan serve --host=0.0.0.0 --port=8000
    tty: true

  queue:
    <<: *app-base
    container_name: cursos_api_queue
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    tty: true

  scheduler:
    <<: *app-base
    container_name: cursos_api_scheduler
    command: php artisan schedule:work
    tty: true

  db:
    image: mysql:8.4
    container_name: cursos_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cursos_api}
      MYSQL_USER: ${DB_USERNAME:-cursos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: cursos_api_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:latest
    container_name: cursos_api_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    logging: *default-logging

  frontend:
    image: node:20-alpine
    container_name: cursos_api_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    tty: true
    logging: *default-logging

volumes:
  dbdata:
    name: ftp_dbdata
  redisdata:
    name: ftp_redisdata
  frontend_node_modules:
    name: ftp_frontend_node_modules
  vendor:
  bootstrap_cache:
